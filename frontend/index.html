<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Agent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Voice AI Agent</h1>
            <div class="settings" style="flex-direction: column; align-items: flex-end; gap: 10px;">
                <div style="display: flex; gap: 15px; align-items: center;">
                    <a href="report.html" style="background-color: var(--accent-color); color: var(--bg-color); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap;" title="Benchmark Report">
                        <i class="fas fa-chart-line"></i> View Report
                    </a>
                    <div class="mode-toggle">
                        <button id="mode-batch" class="mode-btn active">Batch Processing</button>
                        <button id="mode-stream" class="mode-btn">Streaming</button>
                        <button id="mode-stream-llm" class="mode-btn">Streaming LLM</button>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <label for="language-select">Language:</label>
                    <select id="language-select">
                    <option value="auto">Auto-detect (All)</option>
                    <option value="en">English (en)</option>
                    <option value="hi">Hindi (hi)</option>
                    <option value="mr">Marathi (mr)</option>
                    <option value="ta">Tamil (ta)</option>
                    <option value="te">Telugu (te)</option>
                    <option value="kn">Kannada (kn)</option>
                    <option value="ml">Malayalam (ml)</option>
                    <option value="gu">Gujarati (gu)</option>
                    <option value="bn">Bengali (bn)</option>
                    <option value="pa">Punjabi (pa)</option>
                </select>
                </div>
            </div>
        </header>
        
        <main class="chat-interface">
            <div id="chat-box" class="chat-box">
                <div class="message ai-message">
                    <div class="bubble">Hello! I am your AI assistant. How can I help you today?</div>
                </div>
            </div>
        </main>
        
        <div class="controls">
            <button id="record-btn" class="record-btn">
                <i class="fas fa-microphone"></i>
                <span>Press & Hold to Speak</span>
            </button>
            <div id="status" class="status-indicator">Ready</div>
        </div>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
