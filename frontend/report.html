<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Benchmark Report</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .report-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-group input[type="text"], .form-group input[type="password"] {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .model-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }
        .rank-1 {
            color: #ffd700;
            font-weight: bold;
        }
        .rank-2 {
            color: #c0c0c0;
            font-weight: bold;
        }
        .rank-3 {
            color: #cd7f32;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1><a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-arrow-left"></i> Model Benchmark Report</a></h1>
        </header>
        
        <main class="report-container">
            <div class="form-group">
                <label for="api-key">OpenAI API Key</label>
                <input type="password" id="api-key" placeholder="sk-...">
            </div>
            
            <div class="form-group">
                <label>Select Mini Models to Test</label>
                <div class="models-grid">
                    <label class="model-checkbox"><input type="checkbox" value="gpt-4o-mini" checked> gpt-4o-mini</label>
                    <label class="model-checkbox"><input type="checkbox" value="gpt-3.5-turbo" checked> gpt-3.5-turbo</label>
                    <label class="model-checkbox"><input type="checkbox" value="gpt-3.5-turbo-0125"> gpt-3.5-turbo-0125</label>
                    <label class="model-checkbox"><input type="checkbox" value="gpt-3.5-turbo-1106"> gpt-3.5-turbo-1106</label>
                    <label class="model-checkbox"><input type="checkbox" value="gpt-4o"> gpt-4o (baseline)</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="test-prompt">Test Prompt</label>
                <input type="text" id="test-prompt" value="Explain the history of artificial intelligence in 3 paragraphs." placeholder="Enter test prompt...">
            </div>
            
            <button id="run-benchmark-btn" class="btn">Run Benchmark</button>
            <div id="status-indicator" class="status-indicator" style="text-align: center; display: none;">Running benchmark...</div>
            
            <div id="results-section" style="display: block;">
                <h3>Results (Ranked by Speed)</h3>
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Model</th>
                            <th>TTFT (s)</th>
                            <th>Speed (Tokens/s)</th>
                            <th>Total Time (s)</th>
                        </tr>
                    </thead>
                    <tbody>
        <tr>
            <td class="rank-1">#1</td>
            <td>gpt-4o</td>
            <td>0.593</td>
            <td>65.50</td>
            <td>2.29</td>
        </tr>
        <tr>
            <td class="rank-2">#2</td>
            <td>gpt-3.5-turbo-0125</td>
            <td>1.475</td>
            <td>57.86</td>
            <td>2.59</td>
        </tr>
        <tr>
            <td class="rank-3">#3</td>
            <td>gpt-3.5-turbo</td>
            <td>2.033</td>
            <td>49.12</td>
            <td>3.05</td>
        </tr>
        <tr>
            <td class="">#4</td>
            <td>gpt-3.5-turbo-1106</td>
            <td>3.174</td>
            <td>36.90</td>
            <td>4.06</td>
        </tr>
        <tr>
            <td class="">#5</td>
            <td>gpt-4o-mini</td>
            <td>2.725</td>
            <td>33.93</td>
            <td>4.42</td>
        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="report.js?v=1"></script>
</body>
</html>
