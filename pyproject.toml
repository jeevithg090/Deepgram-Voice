[project]
name = "voice-ai-agent"
version = "1.0.0"
description = "Real-time voice AI agent: Deepgram STT, FastEmbed RAG, OpenAI/Gemini LLM and Piper TTS."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: loads the real Piper voice model"]
